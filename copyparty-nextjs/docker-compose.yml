version: '3.8'

services:
  # CopyParty Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copyparty-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Update this to point to your CopyParty backend
      - NEXT_PUBLIC_API_URL=http://localhost:3923
    restart: unless-stopped
    networks:
      - copyparty-network

networks:
  copyparty-network:
    driver: bridge

